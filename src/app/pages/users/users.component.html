<div class="body">
  <section>
    <div class="header">
      <h4>Usuarios</h4>
      <span>Lista de usuarios con acceso al sistema</span>
    </div>
    <div class="d-flex flex-row justify-content-start my-4">
      <p-button 
        label="Nuevo usuario" 
        icon="pi pi-user-plus" 
        (onClick)="showForm()" />
    </div>
    <p-table [value]="rows" [columns]="columns">
      <ng-template pTemplate="header">
        <tr>
          @for (c of columns; track c) {
            <th [class]="c.textAlign === 'center' ? 'text-center' : c.textAlign === 'right' ? 'text-right' : ''"
            [style]="c.width ? 'min-width: ' + c.width + ';' : ''"
            scope="col">
              {{c.title}}
            </th> 
          }
      </ng-template>
      <ng-template pTemplate="body" let-item>
        <tr>
          @for (c of columns; track c) {
            @if (c.key == 'actions') {
              <td class="d-flex align-items-center justify-content-center gap-2">
                <button (click)="showForm(item, 'Editar usuario')" class="button button--icon">
                  <span class="pi pi-user-edit"></span>
                </button>
                <button class="button button--icon">
                  <span class="pi pi-trash"></span>
                </button>
              </td>
            }
            @else {
              <td [class]="c.textAlign === 'center' ? 'text-center' : c.textAlign === 'right' ? 'text-right' : ''">
                <span [style]="c.key == 'name_rol' ? 'font-weight: 600;' :''">{{item[c.key]}}</span>
              </td>
            }
          }
        </tr>
      </ng-template>
    </p-table>
  </section>
</div>

@if (show) {
  <user-form (close)="closeForm($event)" [show]="show" [data]="dataForm" [title]="titleForm"></user-form>
}
