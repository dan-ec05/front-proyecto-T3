<p-dialog
[(visible)]="show" [modal]="true" [style]="{'width': '50rem'}" [draggable]="false"
(onHide)="closeModal(false)">
  <ng-template pTemplate="header">
    <div class="d-flex align-items-center justify-content-between">
      <span class="title">{{title}}</span>
    </div>
  </ng-template>
  <form [formGroup]="form" class="d-flex py-4 flex-row justify-content-around flex-wrap gap-5">
    <div class="d-flex justify-content-between gap-4 align-items-center" style="width: 43%;">
      <label class="label">Mes</label>
      <p-dropdown formControlName="month" scrollHeight="140px" [showClear]="true" styleClass="input-dropdown" [options]="monthsList" optionLabel="name"></p-dropdown>
    </div>
    <div class="d-flex justify-content-between gap-4 align-items-center" style="width: 43%;">
      <label class="label">Médico</label>
      <p-dropdown formControlName="doctor" scrollHeight="140px" styleClass="w-50 input-dropdown" [options]="doctorsList" optionLabel="name"></p-dropdown>
    </div>
    <div class="d-flex justify-content-between gap-4 align-items-center" style="width: 43%;">
      <label class="label">Fecha</label>
      <input formControlName="date" type="date" class="form-control form-date w-50">
    </div>
    <div class="d-flex justify-content-between gap-1 align-items-center" style="width: 43%;">
      <label class="label">Monto (Bs.)</label>
      <p-inputNumber formControlName="amount"></p-inputNumber>
    </div>
  </form>
  <ng-template pTemplate="footer">
    <div class="d-flex flex-row justify-content-end w-100 gap-4">
      <button class="button button--cancel" (click)="closeModal(false)">Cancelar</button>
      <button class="button button--save"
      [ngClass]="form.invalid ? 'btn-disabled' : ''"
      (click)="form.valid ? save() : ''">Guardar</button>
    </div>
  </ng-template>
</p-dialog>
