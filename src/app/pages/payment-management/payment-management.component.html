<div class="body">
  
  <section>
    <div class="header">
      <h4>Gestión de pagos</h4>
    </div>
    <div class="d-flex flex-row justify-content-between my-3">
      <p-button
        styleClass="btn-main-color"
        label="Nuevo pago"
        icon="pi pi-plus" 
        (onClick)="showPaymentForm(0, 'Agregar nuevo pago')"/>
      <div class="d-flex flex-row align-items-center gap-2">
        <label>Filtrar por año</label>
        <p-dropdown
        [placeholder]="yearSelected"
        [options]="yearsSelect"
        [(ngModel)]="yearSelected"
        optionLabel="year"></p-dropdown>
      </div>
    </div>
    <p-table [value]="exampleDataTable" [columns]="columns">
      <ng-template pTemplate="header">
        <tr>
          @for (c of columns; track c) {
            <th [class]="c.textAlign === 'center' ? 'text-center' : c.textAlign === 'right' ? 'text-right' : ''"
            [style]="c.width ? 'min-width: ' + c.width + ';' : ''"
            scope="col">
              {{c.title}}
            </th> 
          }
      </ng-template>

      <ng-template pTemplate="body" let-item let-index="rowIndex">
        <tr>
          @for (c of columns; track c) {
            @if (c.key == 'actions') {
              <td class="d-flex align-items-center justify-content-center gap-2">
                <button class="button button--icon" (click)="showPaymentForm(item, 'Editar pago')">
                  <span class="pi pi-user-edit"></span>
                </button>
                <button class="button button--icon" pTooltip="Eliminar médico" tooltipPosition="top">
                  <span class="pi pi-trash"></span>
                </button>
              </td>
            }
            @else {
              <td [ngClass]="c.textAlign === 'center' ? 'text-center' : c.textAlign === 'right' ? 'text-right' : ''">
                <span [style]="c.key == 'name' ? 'font-weight: 500;' : ''">
                  {{item[c.key]}}
                </span>
              </td>
            }
          }
        </tr>
      </ng-template>
    </p-table>
  </section>
</div>
@if (showPayForm) {
  <payment-form [data]="dataForm" [title]="titleForm" [show]="showPayForm" (close)="closePaymentForm($event)"></payment-form>
}
