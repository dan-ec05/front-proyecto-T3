<p-dialog
[(visible)]="show" [modal]="true" [style]="{'width': '22rem'}" [draggable]="false"
(onHide)="closeModal(false)">
  <ng-template pTemplate="header">
    <div class="d-flex align-items-center justify-content-between">
      <span class="title">{{title}}</span>
    </div>
  </ng-template>
  <form [formGroup]="form" class="d-flex py-4 flex-column justify-content-around flex-wrap gap-5">
    <div class="d-flex w-100 flex-column gap-1 align-items-start">
      <label class="label">N° de consultorio</label>
      <input formControlName="num_consultorio" type="text" class="form-control w-100">
    </div>
    <div class="d-flex w-100 flex-column gap-1 align-items-start">
      <label class="label">Observaciones</label>
      <textarea maxlength="50" formControlName="observaciones" class="form-control"></textarea>
    </div>
  </form>
  <ng-template pTemplate="footer">
    <div class="d-flex flex-row justify-content-end w-100 gap-4">
      <button class="button button--cancel" (click)="closeModal(false)">Cancelar</button>
      <button class="button button--save"
      [ngClass]="form.invalid ? 'btn-disabled' : ''"
      (click)="form.valid ? save() : ''">{{modifyForm ? 'Actualizar' : 'Guardar'}}</button>
    </div>
  </ng-template>
</p-dialog>
