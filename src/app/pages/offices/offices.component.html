<div class="body">
  
  <section>
    <div class="header">
      <h4>Consultorios</h4>
    </div>
    <div class="d-flex flex-row justify-content-between my-3">
      <p-button
        styleClass="btn-main-color"
        label="Nuevo consultorio"
        icon="pi pi-plus" 
        (onClick)="showForm()"/>
    </div>
    <p-table [value]="officesList" [columns]="columns" [rowHover]="true">
      <ng-template pTemplate="header">
        <tr>
          @for (c of columns; track c) {
            <th [class]="c.textAlign === 'center' ? 'text-center' : c.textAlign === 'right' ? 'text-right' : ''"
            [style]="c.width ? 'min-width: ' + c.width + ';' : ''"
            scope="col">
              {{c.title}}
            </th> 
          }
      </ng-template>

      <ng-template pTemplate="body" let-item let-index="rowIndex">
        <tr>
          @for (c of columns; track c) {
            @if (c.key == 'actions') {
              <td class="d-flex align-items-center justify-content-center gap-2">
                <button (click)="showMaintenanceModal(item.id, item)" class="button button--icon">
                  <tooltip [tooltipText]="'Mantenimientos'" [tooltipPosition]="'left'"></tooltip>
                  <span class="pi pi-book"></span>
                </button>
                <button (click)="showForm('Editar consultorio', item)" class="button button--icon">
                  <tooltip [tooltipText]="'Editar consultorio'" [tooltipPosition]="'left'"></tooltip>
                  <span class="pi pi-file-edit"></span>
                </button>
                <button (click)="deleteOffice(item.id, $event)" class="button button--icon">
                  <tooltip [tooltipText]="'Eliminar consultorio'" [tooltipPosition]="'left'"></tooltip>
                  <span class="pi pi-trash"></span>
                </button>
              </td>
            }
            @else {
              <td [class]="c.textAlign === 'center' ? 'text-center' : c.textAlign === 'right' ? 'text-right' : ''">
                {{item[c.key]}}
              </td>
            }
          }
        </tr>
      </ng-template>
    </p-table>
  </section>
</div>

<p-confirmDialog></p-confirmDialog>

<p-toast></p-toast>

@if (showOfficesForm) {
  <offices-form [data]="dataForm" [show]="showOfficesForm" [title]="titleForm" (close)="closeForm($event)"></offices-form>
}

@if (showMaintenanceForm) {
  <maintenance-form [data]="dataForm" [show]="showMaintenanceForm" [id]="id_consultorio" (close)="closeForm($event)"></maintenance-form>
}
