<p-dialog
[(visible)]="show" [modal]="true" [style]="{'width': '50rem'}" [draggable]="false"
(onHide)="closeModal(false)">
  <ng-template pTemplate="header">
    <div class="d-flex align-items-center justify-content-between">
      <span class="title">{{title}}</span>
    </div>
  </ng-template>
  <form [formGroup]="form" class="d-flex py-4 flex-row justify-content-around align-items-start flex-wrap gap-2">
    <div class="d-flex flex-column row-gap-4" style="width: 45%;">
      <div class="d-flex justify-content-between gap-4 align-items-center" style="width: 100%;">
        <label class="label">Nombre y apellido</label>
        <input formControlName="full_name" type="text" class="form-control w-50">
      </div>
      <div class="d-flex justify-content-between gap-4 align-items-center" style="width: 100%;">
        <label class="label">Cédula</label>
        <input formControlName="dni" type="text" class="form-control w-50">
      </div>
    </div>
    <div class="d-flex justify-content-between gap-4 align-items-center">
      <label class="label">Especialidad</label>
      <p-dropdown formControlName="specialism" scrollHeight="100px" styleClass="w-50 input-dropdown input-dropdown--specialism" [options]="specialismList" optionLabel="name"></p-dropdown>
    </div>
  </form>
  <ng-template pTemplate="footer">
    <div class="d-flex flex-row justify-content-end w-100 gap-4">
      <button class="button button--cancel" (click)="closeModal(false)">Cancelar</button>
      <button class="button button--save button--blue"
      [ngClass]="form.invalid ? 'btn-disabled' : ''"
      (click)="form.valid ? save() : ''">Guardar</button>
    </div>
  </ng-template>
</p-dialog>
