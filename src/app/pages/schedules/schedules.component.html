<div class="schedules-body">
  
  <section>
    <div class="header">
      <h4>Horarios</h4>
      <p>Aquí se lleva el control de las relaciones entre los consultorios y los médicos</p>
    </div>
    <div class="d-flex flex-row justify-content-between my-3">
      <p-button
        styleClass="btn-main-color"
        label="Nuevo Horario"
        icon="pi pi-plus" 
        (onClick)="showForm({}, 'Agregar nuevo horario')"/>
    </div>
    <p-table [value]="schedulesList" [columns]="columns" [rowHover]="true">
      <ng-template pTemplate="header">
        <tr>
          @for (c of columns; track c) {
            <th [class]="c.textAlign === 'center' ? 'text-center' : c.textAlign === 'right' ? 'text-right' : ''"
            [style]="c.width ? 'min-width: ' + c.width + ';' : ''"
            scope="col">
              {{c.title}}
            </th> 
          }
      </ng-template>

      <ng-template pTemplate="body" let-item let-index="rowIndex">
        <tr>
          @for (c of columns; track c) {
            @if (c.key == 'actions') {
              <td class="d-flex align-items-center justify-content-center gap-2">
                <button class="button button--icon" (click)="showForm(item, 'Editar horario')">
                  <tooltip [tooltipText]="'Editar horario'" [tooltipPosition]="'left'"></tooltip>
                  <span class="pi pi-file-edit"></span>
                </button>
                <button (click)="deleteSchedule(item.id, $event)" class="button button--icon" pTooltip="Eliminar médico" tooltipPosition="top">
                  <tooltip [tooltipText]="'Eliminar horario'" [tooltipPosition]="'left'"></tooltip>
                  <span class="pi pi-trash"></span>
                </button>
              </td>
            }
            @else if (c.key == 'solvente') {
              <td class="td-tooltip" [ngClass]="c.textAlign === 'center' ? 'text-center' : c.textAlign === 'right' ? 'text-right' : ''">
                <tooltip [tooltipText]="!(item.solvente) && !(item.monto_pagado_formatted) ? 'Sin pagar' : item.solvente && !(item.monto_restante_formatted) ? 'Pagado' : 'Abonado: $' + item.monto_pagado_formatted" [tooltipPosition]="'top'"></tooltip>
                <span [style]="'font-size: 20px; color: ' + (item.solvente && !(item.monto_restante_formatted) ? 'green' : !(item.solvente) && !(item.monto_pagado_formatted) ? 'red' : 'orange')" [ngClass]="(item.solvente) && !(item.monto_restante_formatted) ? 'pi pi-check' : !(item.solvente) && !(item.monto_pagado_formatted) ? 'pi pi-ban' : 'pi pi-exclamation-circle'">
                </span>
              </td>
            }
            @else {
              <td [ngClass]="c.textAlign === 'center' ? 'text-center' : c.textAlign === 'right' ? 'text-right' : ''">
                {{item[c.key]}}
              </td>
            }
          }
        </tr>
      </ng-template>
    </p-table>
  </section>
</div>

<p-toast></p-toast>

<p-confirmDialog></p-confirmDialog>

@if (showScheduleForm) {
  <schedules-form [title]="titleForm" [data]="dataForm" [show]="showScheduleForm" (close)="closeModal($event)"></schedules-form>
}
